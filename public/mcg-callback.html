<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:32px 16px;text-align:center;color:#121A16;background:#fff}</style>
</head>
<body>
<p id="msg">Connecting. This window closes by itself.</p>
<script>
/* Hands the sign-in result back to the page that opened this window, then closes. */
(function(){
  var q = new URLSearchParams(location.search);
  var data = { type:"mcg-oauth", code:q.get("code") || "", state:q.get("state") || "", error:q.get("error_description") || q.get("error") || "" };
  if(window.opener){
    window.opener.postMessage(data, location.origin);
    window.close();
  } else {
    document.getElementById("msg").textContent = "You can close this window and go back to the course page.";
  }
})();
</script>
</body>
</html>
